name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      # The runner's Ubuntu lets user namespaces only to programs AppArmor
      # names, and a test binary is not one: the sites' jails are tested
      # for real only with that off, and MIDDLEWARE_JAIL_REQUIRED makes a
      # jail test that cannot build one fail instead of skipping.
      - name: allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: test
        env:
          MIDDLEWARE_JAIL_REQUIRED: "1"
        run: go test -race ./...
      # The sites' cgroups are tested where the kernel does the work: a
      # transient unit delegated the way middleware.service is, with the
      # test binary started in its house/ (internal/cgroups).
      - name: cgroups, live
        run: |
          for pkg in runtime sitegroups; do
            go test -c -o "$RUNNER_TEMP/$pkg.test" ./internal/$pkg
            sudo systemd-run --wait --pipe --collect --quiet \
              -p Delegate=yes -p DelegateSubgroup=house \
              --setenv=MIDDLEWARE_TEST_CGROUPS=1 \
              "$RUNNER_TEMP/$pkg.test" -test.run Cgroup -test.v -test.count=5 \
              || { sudo dmesg | grep -iE "oom|killed process" | tail -40; exit 1; }
          done
      - name: build
        run: go build -o middleware ./cmd/middleware
      - name: no third-party dependencies in the core
        run: test "$(go list -m all | wc -l)" = "1"
